name: CI — Build, Test & Package

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      # Testcontainers will spin up its own containers — no manual setup needed
      docker:
        image: docker:dind
        options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Build and run tests
        run: mvn clean verify -B
        working-directory: polling-system
        env:
          # Allow Testcontainers to use Docker socket
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit Test Results
          path: "polling-system/**/target/surefire-reports/*.xml"
          reporter: java-junit

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-reports
          path: "polling-system/**/target/site/jacoco/"

      - name: Check coverage threshold
        run: |
          echo "Coverage threshold enforced by JaCoCo Maven plugin (80% minimum)"

  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build poll-service image
        uses: docker/build-push-action@v5
        with:
          context: polling-system
          file: polling-system/poll-service/Dockerfile
          push: false
          tags: polling-system/poll-service:${{ github.sha }},polling-system/poll-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build vote-processor image
        uses: docker/build-push-action@v5
        with:
          context: polling-system
          file: polling-system/vote-processor/Dockerfile
          push: false
          tags: polling-system/vote-processor:${{ github.sha }},polling-system/vote-processor:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
