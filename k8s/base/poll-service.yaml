apiVersion: apps/v1
kind: Deployment
metadata:
  name: poll-service
  namespace: polling-system
  labels:
    app: poll-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: poll-service
  template:
    metadata:
      labels:
        app: poll-service
    spec:
      containers:
        - name: poll-service
          image: polling-system/poll-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-service:5432/polldb
            - name: SPRING_DATASOURCE_USERNAME
              value: polluser
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: polling-secrets
                  key: db-password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka-service:9092
            - name: REDIS_HOST
              value: redis-service
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: polling-secrets
                  key: jwt-secret
            - name: APP_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: poll-service
  namespace: polling-system
spec:
  selector:
    app: poll-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: poll-service-ingress
  namespace: polling-system
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: api.polling.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: poll-service
                port:
                  number: 80
