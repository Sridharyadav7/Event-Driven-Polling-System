spring:
  application:
    name: poll-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/polldb}
    username: ${SPRING_DATASOURCE_USERNAME:polluser}
    password: ${SPRING_DATASOURCE_PASSWORD:pollpassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway manages schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      enable-idempotence: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4

server:
  port: ${SERVER_PORT:8080}

# JWT configuration — secret must be ≥256-bit (32 chars) for HS256
app:
  jwt:
    secret: ${JWT_SECRET:ThisIsAVerySecretKeyForJWTSigningThatIsLongEnough256bits}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours
  poll:
    close-check-interval-ms: ${POLL_CLOSE_INTERVAL_MS:60000}  # 1 minute

# Actuator: expose only health and prometheus in production
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: poll-service
      environment: ${APP_ENV:local}

logging:
  level:
    com.polling: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
